<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sharptext">
  <title>Sharptext</title>
  <style>
    .st-line { fill: #16191D; }
    .st-thread { fill: #C2412D; }
    @media (prefers-color-scheme: dark) {
      .st-line { fill: #F5F4F0; }
      .st-thread { fill: #EE6A52; }
    }
  </style>
  <defs>
    <mask id="st-over" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="34" y="18" width="12" height="16" fill="#000"/>
      <rect x="34" y="66" width="12" height="16" fill="#000"/>
    </mask>
    <mask id="st-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="34" y="42" width="12" height="16" fill="#000"/>
    </mask>
  </defs>
  <g class="st-line" mask="url(#st-over)">
    <rect x="14" y="20.5" width="72" height="11"/>
    <rect x="14" y="68.5" width="52" height="11"/>
  </g>
  <rect class="st-thread" x="36.5" y="6" width="7" height="88" mask="url(#st-under)"/>
  <rect class="st-line" x="14" y="44.5" width="72" height="11"/>
</svg>
